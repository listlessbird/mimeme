version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: findmeme-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: findmeme
      POSTGRES_PASSWORD: findmeme
      POSTGRES_DB: findmeme
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U findmeme -d findmeme" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: findmeme-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: findmeme-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  createbucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; /usr/bin/mc mb myminio/findmeme --ignore-existing; exit 0; "

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: findmeme-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://findmeme:findmeme@postgres:5432/findmeme
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=findmeme
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_REGION=us-east-1
      - S3_FORCE_PATH_STYLE=true
      - EMBED_DEVICE=cpu
    volumes:
      - ./data/cache:/app/data/cache
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: findmeme-worker
    command: >
      celery -A api.tasks.celery_app worker --loglevel=INFO --concurrency=2 --queues=default,ingest,index
    environment:
      - APP_ENV=development
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://findmeme:findmeme@postgres:5432/findmeme
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=findmeme
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_REGION=us-east-1
      - S3_FORCE_PATH_STYLE=true
      - EMBED_DEVICE=cpu
    volumes:
      - ./data/cache:/app/data/cache
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker-gpu:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: findmeme-worker-gpu
    profiles:
      - gpu
      - full
    command: >
      celery -A api.tasks.celery_app worker --loglevel=INFO --concurrency=1 --queues=gpu
    environment:
      - APP_ENV=development
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://findmeme:findmeme@postgres:5432/findmeme
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=findmeme
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - S3_REGION=us-east-1
      - S3_FORCE_PATH_STYLE=true
      - EMBED_DEVICE=cuda
    volumes:
      - ./data/cache:/app/data/cache
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: findmeme-beat
    profiles:
      - full
    command: >
      celery -A api.tasks.celery_app beat --loglevel=INFO
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://findmeme:findmeme@postgres:5432/findmeme
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=findmeme
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  flower:
    image: mher/flower:2.0
    container_name: findmeme-flower
    profiles:
      - monitoring
      - full
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  drizzle-gateway:
    image: ghcr.io/drizzle-team/gateway:latest
    container_name: findmeme-drizzle-gateway
    profiles:
      - monitoring
      - full
    ports:
      - "4983:4983"
    environment:
      - PORT=4983
      - STORE_PATH=/app
      - MASTERPASS=${DRIZZLE_MASTERPASS:-changeme}
    volumes:
      - drizzle_gateway:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  model_cache:
  drizzle_gateway:


networks:
  default:
    name: findmeme-network
