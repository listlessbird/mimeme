[project]
name = "find-meme-services"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "boto3>=1.40.59",
    "imagehash>=4.3.2",
    "pillow>=12.0.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.12.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "transformers>=4.45",
    "accelerate>=0.34",
    "torch>=2.3",
    "numpy>=2.0",
    "bitsandbytes>=0.48.2",
    "torchvision>=0.24.0",
    "fastapi[standard]>=0.122.0",
    "uvicorn[standard]>=0.38.0",
    "httpx>=0.28.1",
    "faiss-cpu>=1.13.0",
    "structlog>=25.5.0",
    "temporalio>=1.9.0",
]

[project.scripts]
api = "api.main:run"


[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [ "src/api", "src/shared"]

[dependency-groups]
dev = [
    "ruff>=0.14.6",
    "types-boto3-custom",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
types-boto3-custom = { path = "vendored/types_boto3_custom-1.40.59-py3-none-any.whl" }
