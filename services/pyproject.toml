[project]
name = "find-meme-services"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "boto3>=1.40.59",
  "imagehash>=4.3.2",
  "pillow>=12.0.0",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "transformers>=4.45",
  "accelerate>=0.34",
  "torch>=2.3",
  "rich>=14.2.0",
  "typer>=0.20.0",
  "numpy>=2.3.4",
  "bitsandbytes>=0.48.2",
  "torchvision>=0.24.0",
  "fastapi[standard]>=0.122.0",
  "uvicorn[standard]>=0.38.0",
  "python-multipart>=0.0.20",
  "httpx>=0.28.1",
  "celery[redis]>=5.5.3",
  "redis>=5.2.1",
  "faiss-cpu>=1.13.0",
  "pydantic-settings>=2.12.0",
  "structlog>=25.5.0",
  "prometheus-client>=0.23.1",
  "tenacity>=9.1.2",
]

[project.scripts]
ingest = "ingestion.cli:app"
api = "api.main:run"


[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion", "src/api"]

[dependency-groups]
dev = [
    "ruff>=0.14.6",
    "celery-types>=0.23.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]