services:
  postgres:
    image: postgres:16-alpine
    container_name: findmeme-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: findmeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: findmeme-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: findmeme-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:latest
    container_name: findmeme-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:latest
    container_name: findmeme-temporal-ui
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: findmeme-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=INFO
      - DB_URL=postgresql://postgres:postgres@postgres:5432/findmeme
      - TEMPORAL_HOST=temporal:7233
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=findmeme
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
    volumes:
      - ./data:/app/data
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  cpu-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: findmeme-cpu-worker
    command: python -m workers.cpu_worker
    environment:
      - APP_ENV=development
      - LOG_LEVEL=INFO
      - DB_URL=postgresql://postgres:postgres@postgres:5432/findmeme
      - TEMPORAL_HOST=temporal:7233
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=findmeme
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - EMBED_DEVICE=cpu
    volumes:
      - ./data:/app/data
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped

  gpu-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: findmeme-gpu-worker
    profiles:
      - gpu
    command: python -m workers.gpu_worker
    environment:
      - APP_ENV=development
      - LOG_LEVEL=INFO
      - DB_URL=postgresql://postgres:postgres@postgres:5432/findmeme
      - TEMPORAL_HOST=temporal:7233
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=findmeme
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
      - EMBED_DEVICE=cuda
    volumes:
      - ./data:/app/data
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      minio:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  model_cache:


networks:
  default:
    name: findmeme-network
