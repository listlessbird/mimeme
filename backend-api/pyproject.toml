[project]
name = "mimeme-backend-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "sqlalchemy==2.0.46",
    "alembic==1.18.4",
    "fastapi[standard]==0.133.1",
    "uvicorn[standard]==0.41.0",
    "httpx==0.28.1",
    "structlog==25.5.0",
    "temporalio==1.23.0",
    "modal==1.3.4",
    "slowapi==0.1.9",
    "asyncpg>=0.31.0",
    "aiobotocore>=3.7.0",
    "scrapling[fetchers]>=0.4,<0.5",
]

# Extras only needed to run models locally (GPU_BACKEND=local) or to import
# src/modal_app for deployment. The Pi runtime uses GPU_BACKEND=modal and never
# imports these, so they stay out of the api/worker images.
[project.optional-dependencies]
compute = [
    "imagehash==4.3.2",
    "pillow==12.1.1",
    "numpy==2.4.2",
    "faiss-cpu==1.13.2",
    "onnxruntime==1.27.0",
    "tokenizers==0.21.4",
    "huggingface-hub==0.36.2",
]
local-gpu = [
    "torch==2.9.0",
    "transformers==4.52.4",
    "torchvision==0.24.0",
    "accelerate==1.12.0",
    "bitsandbytes==0.48.2",
    "einops==0.8.2",
    "pyvips==3.1.1",
]

[project.scripts]
api = "mimeme.api.main:run"
worker = "mimeme.worker:run"
compute = "mimeme.compute.app:run"


[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mimeme"]

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "test" },
    { include-group = "notebook" },
    { include-group = "hooks" },
]
lint = ["ruff==0.15.2"]
typecheck = [
    "pyright",
    "types-aiobotocore>=3.7.0",
    "types-aiobotocore-s3>=3.7.0",
]
test = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "factory-boy==3.3.3",
    "respx==0.22.0",
    "psycopg[binary]==3.2.12",
]
notebook = [
    "ipykernel==7.2.0",
    "matplotlib==3.10.8",
    "nbstripout==0.9.1",
    "pandas==3.0.1",
    "seaborn==0.13.2",
]
hooks = ["pre-commit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "model_smoke: opt-in real model load/inference checks; run with `just test-model`",
    "storage_integration: guarded object-store contract tests against local MinIO",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# N818: short failure names (storage.Missing/Invalid/…) are intentional; no Error suffix.
ignore = ["E501", "N818"]

[tool.ruff.lint.isort]
# Declared explicitly so first-party detection does not depend on the CWD: the
# `src = ["src"]` path resolves differently when ruff runs from the repo root
# (VS Code Ruff extension) vs from backend-api/ (`just fmt`), which otherwise
# makes the editor and CLI disagree on import grouping.
known-first-party = ["mimeme"]

[tool.pyright]
include = ["src"]
exclude = ["tests", "scripts", "model_smoke"]
extraPaths = [".", "src"]
executionEnvironments = [
    { root = ".", pythonVersion = "3.13", extraPaths = [
        ".",
        "src",
    ] },
]
typeCheckingMode = "basic"
strict = [
    "src/mimeme/config.py",
    "src/mimeme/env.py",
    "src/mimeme/logging.py",
    "src/mimeme/media.py",
    "src/mimeme/worker.py",
]
useLibraryCodeForTypes = true
reportMissingTypeStubs = false
reportPrivateImportUsage = false
