[project]
name = "mimeme-backend-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "boto3==1.42.55",
    "imagehash==4.3.2",
    "pillow==12.1.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "sqlalchemy==2.0.46",
    "alembic==1.18.4",
    "psycopg2-binary==2.9.11",
    "transformers==5.2.0",
    "einops==0.8.2",
    "accelerate==1.12.0",
    "torch==2.9.0",
    "numpy==2.4.2",
    "bitsandbytes==0.48.2",
    "torchvision==0.24.0",
    "fastapi[standard]==0.133.1",
    "uvicorn[standard]==0.41.0",
    "httpx==0.28.1",
    "pyvips==3.1.1",
    "faiss-cpu==1.13.2",
    "structlog==25.5.0",
    "temporalio==1.23.0",
    "modal==1.3.4",
    "slowapi==0.1.9",
    "axiom-py==0.10.0",
]

[project.scripts]
api = "api.main:run"


[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/activities", "src/api", "src/domain", "src/modal_app", "src/shared", "src/workers", "src/workflows"]

[dependency-groups]
dev = [
    "ipykernel==7.2.0",
    "matplotlib==3.10.8",
    "nbstripout==0.9.1",
    "pandas==3.0.1",
    "ruff==0.15.2",
    "seaborn==0.13.2",
    "types-boto3-custom==1.40.59",
]
test = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "factory-boy==3.3.3",
    "respx==0.22.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.uv.sources]
types-boto3-custom = { path = "vendored/types_boto3_custom-1.40.59-py3-none-any.whl" }
