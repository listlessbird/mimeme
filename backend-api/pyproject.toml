[project]
name = "mimeme-backend-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "boto3>=1.40.59",
    "imagehash>=4.3.2",
    "pillow>=12.0.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.12.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "transformers>=4.45",
    "einops>=0.8.1",
    "accelerate>=0.34",
    "torch>=2.3",
    "numpy>=2.0",
    "bitsandbytes>=0.48.2",
    "torchvision>=0.24.0",
    "fastapi[standard]>=0.133.1",
    "uvicorn[standard]>=0.38.0",
    "httpx>=0.28.1",
    "pyvips>=2.2.3",
    "faiss-cpu>=1.13.0",
    "structlog>=25.5.0",
    "temporalio>=1.9.0",
    "modal>=0.73",
    "slowapi>=0.1.9",
    "axiom-py>=0.10.0",
]

[project.scripts]
api = "api.main:run"


[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/activities", "src/api", "src/modal_app", "src/shared", "src/workers", "src/workflows"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "nbstripout>=0.9.1",
    "pandas>=3.0.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.6",
    "seaborn>=0.13.2",
    "types-boto3-custom",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
types-boto3-custom = { path = "vendored/types_boto3_custom-1.40.59-py3-none-any.whl" }
