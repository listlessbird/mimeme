services:
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0 --db-filename /data/temporal.db
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  api:
    image: ghcr.io/listlessbird/mimeme-api:${IMAGE_TAG:?set IMAGE_TAG to the release SHA tag}
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - COMPUTE_GATEWAY_URL=http://compute:8010
      - APP_ENV=production
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      temporal:
        condition: service_started
      compute:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1280M
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  worker:
    image: ghcr.io/listlessbird/mimeme-worker:${IMAGE_TAG:?set IMAGE_TAG to the release SHA tag}
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - COMPUTE_GPU_BACKEND=modal
      - COMPUTE_GATEWAY_URL=http://compute:8010
      - APP_ENV=production
    depends_on:
      temporal:
        condition: service_started
      compute:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped
    stop_grace_period: 30s

  compute:
    image: ghcr.io/listlessbird/mimeme-compute:${IMAGE_TAG:?set IMAGE_TAG to the release SHA tag}
    env_file: .env
    environment:
      - APP_ENV=production
      - COMPUTE_GPU_BACKEND=modal
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=1
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - huggingface_cache:/app/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8010/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  temporal_data:
  huggingface_cache:
