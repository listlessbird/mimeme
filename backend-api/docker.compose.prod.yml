services:
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.cpu
      target: api
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - APP_ENV=production
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      temporal:
        condition: service_started
    volumes:
      - faiss_data:/app/data
      - huggingface_cache:/app/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.cpu
      target: worker
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - GPU_BACKEND=modal
      - APP_ENV=production
    depends_on:
      temporal:
        condition: service_started
    volumes:
      - faiss_data:/app/data
      - huggingface_cache:/app/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    platform: linux/arm64
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

volumes:
  portainer_data:
  faiss_data:
  huggingface_cache:
