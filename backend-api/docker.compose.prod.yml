services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.cpu
      target: api
    env_file: .env
    environment:
      - TEMPORAL_HOST=host.docker.internal:7233
      - APP_ENV=production
    ports:
      - "0.0.0.0:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  cpu-worker:
    build:
      context: .
      dockerfile: Dockerfile.cpu
      target: worker
    env_file: .env
    environment:
      - TEMPORAL_HOST=host.docker.internal:7233
      - GPU_BACKEND=modal
      - APP_ENV=production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - faiss_data:/app/data
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    platform: linux/arm64
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

volumes:
  portainer_data:
  faiss_data:
