services:
  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233"
      - "8233:8233"
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  api:
    image: ghcr.io/listlessbird/mimeme-api:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - APP_ENV=production
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      temporal:
        condition: service_started
    volumes:
      - faiss_data:/app/data
      - huggingface_cache:/app/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 2048M
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  worker:
    image: ghcr.io/listlessbird/mimeme-worker:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      - TEMPORAL_HOST=temporal:7233
      - GPU_BACKEND=modal
      - APP_ENV=production
    depends_on:
      temporal:
        condition: service_started
    volumes:
      - faiss_data:/app/data
      - huggingface_cache:/app/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

volumes:
  faiss_data:
  huggingface_cache:
