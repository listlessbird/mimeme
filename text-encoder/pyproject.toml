[project]
name = "mimeme-text-encoder"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy==2.4.2",
    "torch==2.9.0",
    "transformers==4.52.4",
    "tokenizers>=0.21.1",
    "onnx>=1.17.0",
    "onnxruntime>=1.22.0",
    "huggingface-hub>=0.30.0",
    "psutil>=7.0.0",
    "pillow==12.1.1",
    "onnx-ir>=0.2.1",
    "faiss-cpu==1.13.2",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text_encoder"]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ruff==0.15.2",
    "pyright",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["model_smoke"]
markers = [
    "model_smoke: opt-in real model load/inference checks; run with `just test-model`",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["text_encoder"]

[tool.pyright]
include = ["src", "scripts", "model_smoke"]
extraPaths = ["src"]
typeCheckingMode = "basic"
useLibraryCodeForTypes = true
reportMissingTypeStubs = false
reportPrivateImportUsage = false
